services:
  mcp-server:
    build:
      context: ./services/mcp-server
    env_file:
      - .env
    ports:
      - "${MCP_SERVER_PORT:-9001}:9001"

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:9001/mcp}
    depends_on:
      - mcp-server
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./apps/web
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"
